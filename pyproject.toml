[project]
name = "product-review-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "snr-roko", email = "rbbagyei@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
]

[project.scripts]
product-review-extractor = "product_review_extractor:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
